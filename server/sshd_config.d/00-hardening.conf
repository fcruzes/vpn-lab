# /etc/ssh/sshd_config.d/00-hardening.conf
# No sshd o PRIMEIRO valor lido vence. Os arquivos deste diretório são lidos
# em ordem alfabética e o cloud-init grava 50-cloud-init.conf; o prefixo 00-
# garante que estas linhas prevalecem.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
# "ubuntu" é o usuário padrão da imagem; ele tem sudo sem senha, então a
# chave SSH é a única barreira do host.
AllowUsers ubuntu
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
